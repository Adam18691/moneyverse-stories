name: Tayyibat GOD R Auto
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python main.py --god-r
      - uses: actions/upload-artifact@v4
        with:
          name: tayyibat-output
          path: output/
