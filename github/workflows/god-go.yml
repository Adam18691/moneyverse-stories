name: GOD Go v36 SECRET 1000 + 200 LANG DUB ALL COLLECTED
on:
  schedule:
    - cron: '3 18 * * *' # ZW 20:03:15 Golden 1000 + 200 LANG
    - cron: '3 19 * * *'
    - cron: '3 17 * * *'
    - cron: '3 23 * * *'
  workflow_dispatch:
jobs:
  god-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          go mod tidy
          go run main.go
          echo "=== 1000 MODEL + 200 LANG DUB ALL COLLECTED ==="
          ls -lh output/tayyibat_v36_SECRET_1000_MODEL_200_LANG_DUB_4K_ZW_Q4_60fps/
          ls output/tayyibat_v36_SECRET_1000_MODEL_200_LANG_DUB_4K_ZW_Q4_60fps/200lang/ | wc -l
          ls output/tayyibat_v36_SECRET_1000_MODEL_200_LANG_DUB_4K_ZW_Q4_60fps/dub/ | wc -l
          ls output/tayyibat_v36_SECRET_1000_MODEL_200_LANG_DUB_4K_ZW_Q4_60fps/srt/ | wc -l
