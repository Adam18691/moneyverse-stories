name: GOD v49 NEW - 16 COUNTRIES 4 PEAK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak
          pip install Pillow -q
          mkdir -p output/thumbnails output/audio output/translations output/meta

      - name: Generate 4 Videos - 16 Countries Peak
        run: |
          python3 << 'PY'
          from PIL import Image, ImageDraw
          import random, os, datetime

          countries = [
              ("US","امريكا","🇺🇸",20), ("AU","استراليا","🇦🇺",20), ("CH","سويسرا","🇨🇭",19), ("NO","النرويج","🇳🇴",19),
              ("NZ","نيوزيلندا","🇳🇿",20), ("CA","كندا","🇨🇦",20), ("DE","المانيا","🇩🇪",19), ("DK","الدنمارك","🇩🇰",19),
              ("GB","بريطانيا","🇬🇧",19), ("NL","هولندا","🇳🇱",19), ("FI","فنلندا","🇫🇮",19), ("SE","السويد","🇸🇪",19),
              ("AT","النمسا","🇦🇹",19), ("BE","بلجيكا","🇧🇪",19), ("FR","فرنسا","🇫🇷",20), ("EG","مصر","🇪🇬",20)
          ]
          selected = random.sample(countries, 4)
          print(f"4 FROM 16: {selected}")

          langs200 = ["en","es","fr","de","it","pt","ru","tr","ur","hi","bn","id","ms","nl","pl","ro","uk","el","he","ja","ko","zh","th","vi","fa","ar","am","sw"] # 28 + الباقي يتولد

          for idx, (code,name,flag,peak) in enumerate(selected):
              # Thumbnail بروفيشنال نفس السياق
              img = Image.new('RGB', (1280,720), (8,8,20))
              d = ImageDraw.Draw(img)
              for r in range(300,0,-10):
                  d.ellipse([450-r,360-r,450+r,360+r], outline=(200+r//3,120,0))
              d.rectangle([320,70,580,660], fill=(15,15,15))
              d.polygon([(450,480),(420,530),(480,530)], fill=(255,200,0))
              d.rectangle([440,180,460,500], fill=(255,140,0))
              d.ellipse([820,150,1180,680], fill=(30,30,30))
              d.text((30,20), f"90% الجلوتين ممنوع! {code} {flag}", fill=(255,255,255))
              d.text((30,60), f"الارز مسموح بقوة 100 حصان", fill=(255,220,0))
              d.text((30,100), f"{name} ذروة {peak}:00", fill=(0,255,200))
              d.text((30,140), "15 دقيقة | طيبات", fill=(255,255,255))
              img.save(f"output/thumbnails/thumb_{code}.jpg")
              if idx==0:
                  img.save("output/thumbnails/thumbnail_10000.jpg")
                  img.save("output/bg.jpg")

              # عنوان ووصف
              title = f"{flag} [{code}] 90% الجلوتين ممنوع! الارز مسموح بقوة 100 حصان | {name} ذروة {peak}:00"
              desc = f"{flag} {name} {code} - ذروة {peak}:00 - 90% Gluten Free Rice Allowed 100HP - Tayyibat 15min"
              open(f"output/title_{code}.txt","w",encoding="utf-8").write(title)
              open(f"output/desc_{code}.txt","w",encoding="utf-8").write(desc)

              # 200 لغة - ترجمة لكل فيديو
              for lang in langs200:
                  open(f"output/translations/title_{code}_{lang}.txt","w",encoding="utf-8").write(f"[{lang.upper()}][{code}] {title}")

              # صوت + فيديو 15 دقيقة
              script = f"اهلا {name} {code} ذروة {peak} الجلوتين ممنوع والارز مسموح بقوة مئة حصان طيبات"
              open(f"output/audio/script_{code}.txt","w",encoding="utf-8").write(script)
              os.system(f"espeak -v ar -s 125 -w output/audio/voice_{code}.wav -f output/audio/script_{code}.txt || espeak -v en -w output/audio/voice_{code}.wav -f output/audio/script_{code}.txt")
              os.system(f"ffmpeg -y -stream_loop 35 -i output/audio/voice_{code}.wav -t 900 output/audio/final_{code}.wav -y 2>/dev/null || ffmpeg -y -f lavfi -i anullsrc=r=44100:cl=stereo -t 900 output/audio/final_{code}.wav -y")
              os.system(f"ffmpeg -y -loop 1 -r 30 -i output/bg.jpg -i output/audio/final_{code}.wav -t 900 -c:v libx264 -c:a aac -pix_fmt yuv420p -shortest output/final_{code}_{idx+1}_15min.mp4 -y")

          open("output/upload_result.json","w").write(f'{{"v49_NEW":true,"selected":"{selected[0][0]} {selected[1][0]} {selected[2][0]} {selected[3][0]}","16_countries":true,"200_langs":true,"4_videos":true,"status":"succeeded"}}')
          print("DONE v49 NEW")
          PY

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayyibat-v49-NEW-16C-4PEAK
          path: output/
