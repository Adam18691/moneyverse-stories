name: build-and-run
on: {workflow_dispatch:}
jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Install Hidden Sulaiman Pro - Go Native - No FFmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y blender gstreamer1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gpac sox libopenal-dev
          pip install opentimelineio piper-tts TTS edge-tts -q || true
          # Sherpa-ONNX Go - Hidden
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.10.11/sherpa-onnx-v1.10.11-linux-x86_64-shared.tar.bz2
          tar -xjf sherpa-onnx-*.tar.bz2
          sudo cp sherpa-onnx-*/lib/* /usr/local/lib/ -v
          sudo ldconfig
          # Shaka - Google
          wget -q https://github.com/shaka-project/shaka-packager/releases/download/v3.3.0/packager-linux-x64 -O packager
          chmod +x packager
          sudo mv packager /usr/local/bin/shaka-packager || true
          # MistServer - Holland - 1000 TV channels
          wget -q https://releases.mistserver.org/is/2024-01-12/MistServer_64bit.tar.gz
          tar -xzf MistServer_*.tar.gz || true
          go mod tidy
          rm -f ai_router.go security.go
          mkdir -p frames

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env: {GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}}

      - name: 🔥 Run Hidden Sulaiman Go
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SOURCE_YT_URL: ${{ secrets.SOURCE_YT_URL }}
        run: go run main.go
