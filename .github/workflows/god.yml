name: build-and-run
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and Melt - Cinematic Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg melt
          ffmpeg -version
          melt --version

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Run GOD v44
        run: |
          go mod tidy
          go run main.go
          ls -lh *.mp4
          ls -lh *.wav

      - name: Upload - 4 Videos 15 Min Cinematic
        uses: actions/upload-artifact@v4
        with:
          name: TAYYIBAT-15MIN-4VIDEOS
          path: |
            FINAL*.mp4
            *.mp4
          if-no-files-found: error
