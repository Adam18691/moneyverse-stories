name: GOD v29 PURE 4K 60fps
on: [push]
jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: '1.22'
      - name: Install FFmpeg Only
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Run GOD v29
        run: |
          go mod tidy
          go run main.go
          ls -lh
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final
          path: final.mp4
          if-no-files-found: warn
