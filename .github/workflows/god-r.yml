name: GOD R v28.2 FINAL PURE R - ZW بدل SA - Q4
on:
  schedule:
    - cron: '0 19 * * *' # EG مصر 21:00
    - cron: '0 18 * * *' # ZW زيمبابوي 20:00 Harare - جديدة بدل SA
    - cron: '0 17 * * *' # AE الامارات 21:00
    - cron: '0 23 * * *' # US امريكا 19:00
  workflow_dispatch:

jobs:
  god-r-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install R FINAL
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base libmagick++-dev libavfilter-dev
          R -e "install.packages(c('magick','av','stringr','glue','jsonlite'), repos='https://cloud.r-project.org')"
      - name: Run v28.2 FINAL PURE R
        run: |
          Rscript main.R
          ls -lh output/
          cat output/global_schedule_Q4.json
          cat output/title.txt
      - name: Upload 4K ZW
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_ENC: ${{ secrets.YT_TOKEN_ENC }}
        run: python youtube_secure_upload.py
