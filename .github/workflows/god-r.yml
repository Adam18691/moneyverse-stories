name: GOD R v28.3 FINAL - Fixed
on:
  schedule:
    - cron: '0 19 * * *'
    - cron: '0 18 * * *'
    - cron: '0 17 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:
jobs:
  god-r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install R - FIXED NO libuv
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base libmagick++-dev ffmpeg
          sudo mkdir -p /usr/local/lib/R/site-library
          sudo chmod -R 777 /usr/local/lib/R/site-library
          sudo R -e "install.packages(c('magick','av','jsonlite','glue','stringr'), repos='https://cloud.r-project.org', lib='/usr/local/lib/R/site-library')"
      - name: Generate Video 4K - Full Folder v28.3 ZW
        run: |
          Rscript main.R
          ls -R output/tayyibat_v28.3_FINAL_PURE_R_4K_ZW_Q4_60fps/
      - name: Upload YouTube PURE R - Full Folder FIXED
        run: Rscript youtube_secure_upload.R
