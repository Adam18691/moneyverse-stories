name: Tayyibat GOD R - فيديو ذروة مضمون 3
on:
  schedule:
    - cron: '0 17,19,21 * * *' # 7 و 9 و 11 م بتوقيت القاهرة
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install deps
        run: |
          pip install gTTS pillow pydub google-api-python-client google-auth-httplib2 google-auth-oauthlib
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          
      - name: Generate Video
        run: |
          python main.py
          ls -lh output/
          
      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_ENC: ${{ secrets.YT_TOKEN_ENC }}
        run: |
          python youtube_secure_upload.py
          
      - name: Upload artifact (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-output
          path: output/
          if-no-files-found: warn
