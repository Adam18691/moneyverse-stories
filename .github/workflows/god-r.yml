name: GOD R v28.2 FINAL PURE R - ZW - YouTube R
on:
  schedule:
    - cron: '0 19 * * *' # EG 21:00
    - cron: '0 18 * * *' # ZW زيمبابوي 20:00 Harare - بدل SA
    - cron: '0 17 * * *' # AE 21:00
    - cron: '0 23 * * *' # US 19:00
  workflow_dispatch:

jobs:
  god-r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install R FINAL PURE R
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base libmagick++-dev libavfilter-dev libcurl4-openssl-dev
          R -e "install.packages(c('magick','av','tuber','gargle','httr','jsonlite','glue','stringr','openssl'), repos='https://cloud.r-project.org')"
      - name: Generate Video 4K PURE R
        run: |
          Rscript main.R
          ls -lh output/
          cat output/title.txt
      - name: Upload YouTube PURE R - youtube_secure_upload.R
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_ENC: ${{ secrets.YT_TOKEN_ENC }}
        run: |
          Rscript youtube_secure_upload.R
          cat output/upload_result.json
