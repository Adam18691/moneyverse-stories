name: GOD v48 FINAL - 16 COUNTRIES 200 LANG 4 PEAK ALL MERGED
on:
  schedule:
    - cron: '0 17 * * *' # 8م مصر/السعودية/فرنسا = 17 UTC
    - cron: '0 18 * * *' # 8م اوروبا سويسرا المانيا هولندا بلجيكا النمسا = 18 UTC
    - cron: '0 0 * * *' # 8م امريكا كندا = 0 UTC
    - cron: '0 10 * * *' # 8م استراليا نيوزيلندا = 10 UTC
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-naskh-arabic espeak
          pip install Pillow -q
          go mod init tayyibat 2>/dev/null || true
          go get github.com/philippgille/chromem-go golang.org/x/oauth2 google.golang.org/api/youtube/v3
          go mod tidy
          go run main.go
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      - uses: actions/upload-artifact@v4
        with: { name: tayyibat-v48-FINAL-16C-200LANG-4PEAK-${{ github.run_number }}, path: output/ }
