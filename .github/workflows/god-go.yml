name: GOD v48 - 4 FROM 16 COUNTRIES PEAK
on:
  schedule:
    - cron: '0 17 * * *' # ذروة مصر 8 مساء = 15 UTC
    - cron: '0 18 * * *' # ذروة اوروبا 8 مساء = 18 UTC
    - cron: '0 0 * * *' # ذروة امريكا/كندا 8 مساء EST = 0 UTC
    - cron: '0 10 * * *' # ذروة استراليا/نيوزيلندا 8 مساء = 10 UTC
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-naskh-arabic espeak
          pip install Pillow -q
          go mod tidy
          go run main.go
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      - uses: actions/upload-artifact@v4
        with: { name: tayyibat-16countries-4peak-${{ github.run_number }}, path: output/ }
