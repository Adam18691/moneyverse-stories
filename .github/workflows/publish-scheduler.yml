name: 🗓️ Scheduled Publisher

on:
  schedule:
    - cron: '0 */2 * * *' # كل ساعتين — في بداية كل منتصف الساعة
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - run: go mod tidy

      - name: 🗓️ Check & Publish Due Videos
        run: go run ./cmd/publisher
        env:
          # بيانات الاعتماد — نظام 3 أسطر (بدون ملف JSON)
          YT_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

      - name: 💾 Save State Back
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🗓️ publisher state update [skip ci]"
          file_pattern: schedule/pending.json
