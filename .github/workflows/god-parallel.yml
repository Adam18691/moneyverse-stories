name: 🔥 GOD Parallel Engine

on:
  workflow_dispatch:
    inputs:
      videos:
        description: 'عدد الفيديوهات (0 = تلقائي حسب الحصة)'
        required: false
        default: '0'
  schedule:
    - cron: '0 6,14,20 * * *'

permissions:
  contents: write

jobs:
  god-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # ============================================================
      # 🧰 أدوات أساسية — ffmpeg + edge-tts + Whisper
      # ============================================================
      - name: 🧰 Install Tools (ffmpeg + edge-tts + whisper)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --upgrade edge-tts --quiet
          pip install openai-whisper --quiet
          which ffmpeg
          which edge-tts

      # ============================================================
      # 🔑 بيانات الاعتماد + المجلدات
      # ============================================================
      - name: 🔑 Write Credentials
        run: |
          mkdir -p credentials secrets models data output thumbnails subtitles audio
          echo "PEXELS_API_KEY=$PEXELS_API_KEY" >> credentials/env
          echo "✅ Credentials + folders ready"
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      # ============================================================
      # 🗣️ Piper TTS — المحرك الموحد لكل اللغات
      # ============================================================
      - name: 🎙️ Install Piper TTS (full bundle)
        run: |
          cd $HOME
          curl -sL "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz" -o piper.tar.gz
          tar xzf piper.tar.gz
          sudo rm -rf /opt/piper
          sudo mv piper /opt/piper
          sudo ln -sf /opt/piper/piper /usr/local/bin/piper
          echo "piper bundle installed"

      # ============================================================
      # 🎙️ موديلات Piper — حلقة تحميل بلا دوال (آمنة لأي shell)
      # ============================================================
      - name: 🎙️ Download Piper Voice Models
        run: |
          mkdir -p models
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main"
          LIST="
          ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx 50000000
          ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx.json 2000
          en/en_US/ryan/high/en_US-ryan-high.onnx 50000000
          en/en_US/ryan/high/en_US-ryan-high.onnx.json 2000
          es/es_ES/carlfm/x_low/es_ES-carlfm-x-low.onnx 20000000
          es/es_ES/carlfm/x_low/es_ES-carlfm-x-low.onnx.json 2000
          tr/tr_TR/fahrettin/medium/tr_TR-fahrettin-medium.onnx 20000000
          tr/tr_TR/fahrettin/medium/tr_TR-fahrettin-medium.onnx.json 2000
          fr/fr_FR/siwis/low/fr_FR-siwis-low.onnx 20000000
          fr/fr_FR/siwis/low/fr_FR-siwis-low.onnx.json 2000
          de/de_DE/eva_k/x_low/de_DE-eva_k-x-low.onnx 20000000
          de/de_DE/eva_k/x_low/de_DE-eva_k-x-low.onnx.json 2000
          "
          echo "$LIST" | while read REL MIN; do
            [ -z "$REL" ] && continue
            OUT="models/(basename(basename(basenameREL)"
            OK=0
            for i in 1 2 3 4 5; do
              curl -4 -sL --retry 3 --connect-timeout 20 "BASE/BASE/BASE/REL" -o "$OUT"
              SIZE=(stat−c(stat -c%s "(stat−cOUT" 2>/dev/null || echo 0)
              if [ "SIZE"−gt"SIZE" -gt "SIZE"−gt"MIN" ]; then
                echo "OK OUTOUTOUTSIZE bytes"
                OK=1
                break
              fi
              echo "RETRY OUTsize=OUT size=OUTsize=SIZE try=$i"
              sleep 10
            done
            if [ "$OK" = "0" ]; then
              echo "FAIL $OUT"
            fi
          done
          echo "=== JSON check — first 30 chars ==="
          head -c 30 models/*.json
          echo ""

      # ============================================================
      # 🔨 البناء
      # ============================================================
      - name: Build Engine
        run: |
          go mod tidy
          go vet ./... || true
          go build -o god-engine .
          echo "BUILD OK"

      # ============================================================
      # 🔥 الإنتاج الكامل
      # ============================================================
      - name: 🔥 GOD Production Run
        run: |
          ./god-engine
        env:
          VIDEOS_COUNT: ${{ github.event.inputs.videos }}
          CGO_ENABLED: '0'
          LD_LIBRARY_PATH: /opt/piper
          PIPER_PATH: /opt/piper/piper

      # ============================================================
      # 🔍 تشخيص + ذاكرة التعلم
      # ============================================================
      - name: 🔍 Locate Output Files
        if: always()
        run: |
          echo "=== mp4 files ==="
          find . -name "*.mp4" -not -path "./models/*" -not -path "./.git/*" || true
          echo "=== wav files ==="
          find . -name "*.wav" -not -path "./models/*" -not -path "./.git/*" || true
          echo "=== self-tune memory ==="
          cat data/qa_config.json 2>/dev/null || echo "no self-tune config yet"
          echo "=== root ==="
          ls -la

      # ============================================================
      # 📦 أرشفة النتائج
      # ============================================================
      - name: 📦 Archive Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: |
            **/*.mp4
            **/*.jpg
            **/*.srt
            !models/**
            !.git/**
          if-no-files-found: ignore

      # ============================================================
      # 💾 حفظ الحالة + ذاكرة التعلم
      # ============================================================
      - name: 💾 Save State Back
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "god-engine state + QA self-tune update [skip ci]"
          file_pattern: "schedule/*.json data/*.json"
