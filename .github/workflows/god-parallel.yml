name: GOD Parallel Engine

on:
  workflow_dispatch:
    inputs:
      videos:
        description: 'عدد الفيديوهات (0 = تلقائي)'
        required: false
        default: '0'
  schedule:
    - cron: '0 6,14,20 * * *'

permissions:
  contents: write

jobs:
  god-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --upgrade edge-tts --quiet
          pip install faster-whisper --quiet

      - name: Write Credentials
        run: |
          mkdir -p credentials secrets models data output thumbnails subtitles audio
          echo "PEXELS_API_KEY=$PEXELS_API_KEY" >> credentials/env
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Install RNNoise
        run: |
          curl -4 -sL "https://media.githubusercontent.com/media/GregorR/rnnoise-models/master/somnolent-hogwash-2018-09-01/shr.wavenet.rnnn" -o models/std.rnnn
          ls -la models/std.rnnn || echo "rnnoise skipped"

      - name: Install Kokoro-ONNX
        run: |
          pip install kokoro-onnx soundfile --quiet
          curl -4 -sL "https://huggingface.co/thewh1teagle/kokoro-onnx/resolve/main/kokoro-v1.0.onnx" -o models/kokoro.onnx
          curl -4 -sL "https://huggingface.co/thewh1teagle/kokoro-onnx/resolve/main/voices-v1.0.bin" -o models/kokoro-voices.bin
          ls -la models/kokoro.onnx models/kokoro-voices.bin || echo "kokoro missing - piper covers"

      - name: Install KittenTTS
        run: |
          pip install kittentts soundfile --quiet || echo "kitten skipped"
          python3 -c "from kittentts import KittenTTS; print('kitten ready')" || echo "kitten failed"

      - name: Install Bark
        run: |
          pip install suno-bark scipy --quiet
          python3 -c "import bark; print('bark ready')" || echo "bark failed"
        env:
          SUNO_USE_SMALL_MODELS: '1'

      - name: Install Piper TTS
        run: |
          cd $HOME
          curl -sL "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz" -o piper.tar.gz
          tar xzf piper.tar.gz
          sudo rm -rf /opt/piper
          sudo mv piper /opt/piper
          sudo ln -sf /opt/piper/piper /usr/local/bin/piper
          echo "piper installed"

      - name: Download Piper Models
        run: |
          mkdir -p models
          B="https://huggingface.co/rhasspy/piper-voices/resolve/main"
          curl -4 -sL "$B/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx" -o models/ar.onnx
          curl -4 -sL "$B/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx.json" -o models/ar.onnx.json
          curl -4 -sL "$B/en/en_US/ryan/high/en_US-ryan-high.onnx" -o models/en.onnx
          curl -4 -sL "$B/en/en_US/ryan/high/en_US-ryan-high.onnx.json" -o models/en.onnx.json
          curl -4 -sL "$B/es/es_ES/carlfm/x_low/es_ES-carlfm-x_low.onnx" -o models/es.onnx
          curl -4 -sL "$B/es/es_ES/carlfm/x_low/es_ES-carlfm-x_low.onnx.json" -o models/es.onnx.json
          curl -4 -sL "$B/tr/tr_TR/fahrettin/medium/tr_TR-fahrettin-medium.onnx" -o models/tr.onnx
          curl -4 -sL "$B/tr/tr_TR/fahrettin/medium/tr_TR-fahrettin-medium.onnx.json" -o models/tr.onnx.json
          curl -4 -sL "$B/fr/fr_FR/siwis/low/fr_FR-siwis-low.onnx" -o models/fr.onnx
          curl -4 -sL "$B/fr/fr_FR/siwis/low/fr_FR-siwis-low.onnx.json" -o models/fr.onnx.json
          curl -4 -sL "$B/de/de_DE/eva_k/x_low/de_DE-eva_k-x_low.onnx" -o models/de.onnx
          curl -4 -sL "$B/de/de_DE/eva_k/x_low/de_DE-eva_k-x_low.onnx.json" -o models/de.onnx.json
          curl -4 -sL "$B/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx" -o models/pt.onnx
          curl -4 -sL "$B/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx.json" -o models/pt.onnx.json
          curl -4 -sL "$B/it/it_IT/riccardo/x_low/it_IT-riccardo-x_low.onnx" -o models/it.onnx
          curl -4 -sL "$B/it/it_IT/riccardo/x_low/it_IT-riccardo-x_low.onnx.json" -o models/it.onnx.json
          ls -la models/

      - name: Build Engine
        run: |
          go mod tidy
          go build -o god-engine .
          echo "BUILD OK"

      - name: Production Run
        run: |
          ./god-engine
        env:
          VIDEOS_COUNT: ${{ github.event.inputs.videos }}
          CGO_ENABLED: '0'
          LD_LIBRARY_PATH: /opt/piper
          PIPER_PATH: /opt/piper/piper
          SUNO_USE_SMALL_MODELS: '1'
          SUNO_OFFLOAD_CPU: '1'
          OMP_NUM_THREADS: '2'

      - name: Locate Output Files
        if: always()
        run: |
          echo "=== mp4 ==="
          find . -name "*.mp4" -not -path "./models/*" -not -path "./.git/*" || true
          echo "=== self-tune ==="
          cat data/qa_config.json 2>/dev/null || echo "none"
          echo "=== daily report ==="
          cat data/daily_report.json 2>/dev/null || echo "none"

      - name: Archive Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: |
            **/*.mp4
            **/*.jpg
            **/*.srt
            !models/**
            !.git/**
          if-no-files-found: ignore

      - name: Save State Back
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "god-engine v2.1 [skip ci]"
          file_pattern: "schedule/*.json data/*.json"
