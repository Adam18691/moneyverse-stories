name: GOD Parallel Engine

on:
  workflow_dispatch:
    inputs:
      videos:
        description: 'عدد الفيديوهات (0 = تلقائي)'
        required: false
        default: '0'
  schedule:
    - cron: '0 6,14,20 * * *'

permissions:
  contents: write

env:
  LANGUAGES: ${{ vars.LANGUAGES }}
  VIDEO_LENGTH: ${{ vars.VIDEO_LENGTH }}
  VIDEOS_PER_DAY: ${{ vars.VIDEOS_PER_DAY }}
  MIN_TREND_SCORE: ${{ vars.MIN_TREND_SCORE }}
  THUMBNAIL_WIDTH: ${{ vars.THUMBNAIL_WIDTH }}
  THUMBNAIL_HEIGHT: ${{ vars.THUMBNAIL_HEIGHT }}
  AUDIO_BITRATE: ${{ vars.AUDIO_BITRATE }}
  VIDEO_BITRATE: ${{ vars.VIDEO_BITRATE }}
  MAX_RETRIES: ${{ vars.MAX_RETRIES }}
  LOG_LEVEL: ${{ vars.LOG_LEVEL }}
  ENABLE_AUTO_PUBLISH: ${{ vars.ENABLE_AUTO_PUBLISH }}
  ENABLE_ANALYTICS: ${{ vars.ENABLE_ANALYTICS }}

  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  SUNO_API_KEY: ${{ secrets.SUNO_API_KEY }}

jobs:
  god-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5.0.0
        with:
          go-version: '1.22'
          cache: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick git curl ca-certificates
          echo "✅ System deps installed"

      - name: Install Python Tools
        run: |
          python3 -m pip install --upgrade pip --quiet
          pip install --upgrade edge-tts faster-whisper soundfile --quiet
          echo "✅ Python deps installed"

      - name: Create Directories
        run: |
          mkdir -p credentials secrets models data output thumbnails subtitles audio
          echo "✅ Directories created"

      - name: Setup Google Credentials
        run: |
          cat > credentials/google-config.json <<EOF
          {
            "type": "oauth2",
            "client_id": "$GOOGLE_CLIENT_ID",
            "client_secret": "$GOOGLE_CLIENT_SECRET",
            "channel_id": "$YOUTUBE_CHANNEL_ID"
          }
          EOF
          echo "✅ Google OAuth configured"

      - name: Install Piper TTS
        run: |
          cd $HOME
          if [ ! -d "/opt/piper" ]; then
            echo "📥 Downloading Piper..."
            curl -4 -sL "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz" -o piper.tar.gz
            tar xzf piper.tar.gz
            sudo rm -rf /opt/piper
            sudo mv piper /opt/piper
            sudo ln -sf /opt/piper/piper /usr/local/bin/piper
          fi
          piper --help >/dev/null && echo "✅ Piper ready" || echo "❌ Piper failed"

      - name: Download Piper Models
        run: |
          mkdir -p models
          HUGGINGFACE_URL="https://huggingface.co/rhasspy/piper-voices/resolve/main"
          for lang in ar en fr de es ja ko pt it tr id hi zh; do
            echo "📥 Downloading $lang model..."
            curl -4 -sL "$HUGGINGFACE_URL/..." -o models/$lang.onnx 2>/dev/null || echo "⚠️ $lang model skipped"
          done
          echo "✅ Models downloaded"

      - name: Verify Go Dependencies
        run: |
          go mod download
          go mod verify
          echo "✅ Go dependencies verified"

      - name: Build Engine
        run: |
          go build -v -o god-engine .
          echo "✅ Build completed"

      - name: Run Production Engine
        if: success()
        run: |
          export VIDEOS_COUNT="${{ github.event.inputs.videos }}"
          export CGO_ENABLED='0'
          export LD_LIBRARY_PATH=/opt/piper
          export PIPER_PATH=/opt/piper/piper
          export SUNO_USE_SMALL_MODELS='1'
          export SUNO_OFFLOAD_CPU='1'
          export OMP_NUM_THREADS='2'
          timeout 55m ./god-engine || echo "⚠️ Engine timeout or error"
        continue-on-error: true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4.3.0
        with:
          name: god-engine-run-${{ github.run_number }}
          path: |
            output/**/*.mp4
            thumbnails/**/*.jpg
            data/**/*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit Changes
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5.0.4
        with:
          commit_message: "🔄 god-engine run #${{ github.run_number }} [skip ci]"
          commit_user_name: "God Engine Bot"
          commit_user_email: "god-engine@moneyverse.bot"
          file_pattern: "data/**/*.json"
          push_options: '--force-with-lease'
          skip_dirty_check: false

      - name: Send Discord Notification
        if: always() && vars.WEBHOOK_URL != ''
        run: |
          STATUS="${{ job.status }}"
          curl -X POST "${{ vars.WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "content": "🎬 God Engine Run #${{ github.run_number }} finished with status: '"$STATUS"'"
            }'
