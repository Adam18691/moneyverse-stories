name: 🔥 GOD Parallel Engine

on:
  workflow_dispatch:
    inputs:
      videos:
        description: 'عدد الفيديوهات (0 = تلقائي حسب الحصة)'
        required: false
        default: '0'
  schedule:
    - cron: '0 6,14,20 * * *'

permissions:
  contents: write

jobs:
  god-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 🧰 Install Tools (ffmpeg + edge-tts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install edge-tts --quiet
          which ffmpeg
          which edge-tts

      - name: 🔑 Write Credentials
        run: |
          mkdir -p credentials secrets
          [ -n "PEXELS_API_KEY" ] && echo "PEXELS_API_KEY=$PEXELS_API_KEY" >> credentials/env
          echo "✅ Credentials written:"
          ls -la credentials/
          ls -la secrets/
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      # ============================================================
      # 🔊 Piper TTS — الحزمة الكاملة (بال مكتباتها + espeak)
      # ============================================================
      - name: 🎙️ Install Piper TTS (full bundle)
        run: |
          cd $HOME
          curl -sL "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz" -o piper.tar.gz
          tar xzf piper.tar.gz
          sudo rm -rf /opt/piper
          sudo mv piper /opt/piper
          sudo ln -sf /opt/piper/piper /usr/local/bin/piper
          echo "📦 محتويات الحزمة:"
          ls -la /opt/piper/
          echo "✅ piper bundle installed (libs + espeak-data داخلها)"

      # ============================================================
      # 🎙️ موديلات الأصوات — مطابقة لأسماء tts.go بالضبط
      # ============================================================
      - name: 🎙️ Download All Voice Models
        run: |
          mkdir -p models
          HF="https://huggingface.co/rhasspy/piper-voices/resolve/main"
          download() {
            curl -sL "HF/HF/HF/1.onnx" -o "models/(basename(basename(basename1).onnx"
            curl -sL "HF/HF/HF/1.onnx.json" -o "models/(basename(basename(basename1).onnx.json"
            echo "  ✅ (basename(basename(basename1).onnx"
          }
          download "ar/ar_JO/kareem/medium/ar_JO-kareem-medium"
          download "en/en_US/ryan/high/en_US-ryan-high"
          download "es/es_ES/carlfm/x_low/es_ES-carlfm-x-low"
          download "tr/tr_TR/fahrettin/medium/tr_TR-fahrettin-medium"
          echo "📁 models/ النهائي:"
          ls -la models/

      # ============================================================
      # البناء
      # ============================================================
      - name: Build Engine
        run: |
          go mod tidy
          go vet ./... || true
          go build -o god-engine .
          echo "✅ BUILD OK"

      # ============================================================
      # الإنتاج الكامل — مع مسار مكتبات piper
      # ============================================================
      - name: 🔥 GOD Production Run
        run: |
          ./god-engine
        env:
          VIDEOS_COUNT: ${{ github.event.inputs.videos }}
          CGO_ENABLED: '0'
          LD_LIBRARY_PATH: /opt/piper
          PIPER_PATH: /opt/piper/piper

      # ============================================================
      # أرشفة النتائج (حتى لو فشل جزئياً)
      # ============================================================
      - name: 📦 Archive Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: |
            output/*.mp4
            thumbnails/*.jpg
          if-no-files-found: ignore

      - name: 💾 Save State Back
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔥 god-engine state update [skip ci]"
          file_pattern: "schedule/*.json data/*.json"
