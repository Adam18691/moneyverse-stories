name: 🔥 GOD Parallel Engine

on:
  workflow_dispatch:
    inputs:
      videos:
        description: 'عدد الفيديوهات (0 = تلقائي)'
        required: false
        default: '0'
  schedule:
    - cron: '0 6,14,20 * * *'

permissions:
  contents: write

jobs:
  god-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 🧰 Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --upgrade edge-tts --quiet
          pip install faster-whisper --quiet

      - name: 🔑 Write Credentials
        run: |
          mkdir -p credentials secrets models data output thumbnails subtitles audio
          echo "PEXELS_API_KEY=$PEXELS_API_KEY" >> credentials/env
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: 🔊 Install RNNoise
        run: |
          mkdir -p models
          curl -4 -sL --retry 3 "https://media.githubusercontent.com/media/GregorR/rnnoise-models/master/somnolent-hogwash-2018-09-01/shr.wavenet.rnnn" -o models/std.rnnn || true
          SIZE=$(stat -c%s models/std.rnnn 2>/dev/null || echo 0)
          echo "rnnoise size: $SIZE"
          if [ "$SIZE" -lt 100000 ]; then
            rm -f models/std.rnnn
            echo "rnnoise skipped - enhance works without it"
          fi

      - name: 🥇 Install Kokoro-ONNX
        run: |
          pip install kokoro-onnx soundfile --quiet
          curl -4 -sL --retry 3 "https://huggingface.co/thewh1teagle/kokoro-onnx/resolve/main/kokoro-v1.0.onnx" -o models/kokoro-v1.0.onnx || true
          curl -4 -sL --retry 3 "https://huggingface.co/thewh1teagle/kokoro-onnx/resolve/main/voices-v1.0.bin" -o models/kokoro-v1.0-voices.bin || true
          S1=$(stat -c%s models/kokoro-v1.0.onnx 2>/dev/null || echo 0)
          S2=$(stat -c%s models/kokoro-v1.0-voices.bin 2>/dev/null || echo 0)
          echo "kokoro sizes: S1+S1 +S1+S2"
          if [ "S1"−lt50000000]∣∣["S1" -lt 50000000 ] || [ "S1"−lt50000000]∣∣["S2" -lt 1000000 ]; then
            rm -f models/kokoro-v1.0.onnx models/kokoro-v1.0-voices.bin
            echo "kokoro-onnx incomplete - piper covers english"
          fi

      - name: 🐱 Install KittenTTS
        run: |
          pip install kittentts soundfile --quiet || echo "kitten skipped"
          python3 -c "from kittentts import KittenTTS; print('kitten ready')" || echo "kitten failed - kokoro covers"

      - name: 🎭 Install Bark
        run: |
          pip install suno-bark scipy --quiet
          python3 -c "import bark; print('bark ready')" || echo "bark failed - piper covers"
        env:
          SUNO_USE_SMALL_MODELS: '1'

      - name: 🎙️ Install Piper TTS
        run: |
          cd $HOME
          curl -sL "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz" -o piper.tar.gz
          tar xzf piper.tar.gz
          sudo rm -rf /opt/piper
          sudo mv piper /opt/piper
          sudo ln -sf /opt/piper/piper /usr/local/bin/piper
          echo "piper bundle installed"

      - name: 🌍 Download Piper Models (12 languages)
        run: |
          mkdir -p models
          B="https://huggingface.co/rhasspy/piper-voices/resolve/main"
          dl() {
            curl -4 -sL --retry 3 --connect-timeout 20 "B/B/B/1" -o "models/$2" || true
            S=(stat−c(stat -c%s "models/(stat−c2" 2>/dev/null || echo 0)
            echo "2=2 =2=S bytes"
            if [ "S"−lt2000];thenrm−f"models/S" -lt 2000 ]; then rm -f "models/S"−lt2000];thenrm−f"models/2"; echo "WARN $2 skipped"; fi
          }
          dl "ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx" "ar_JO-kareem-medium.onnx"
          dl "ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx.json" "ar_JO-kareem-medium.onnx.json"
          dl "en/en_US/ryan/high/en_US-ryan-high.onnx" "en_US-ryan-high.onnx"
          dl "en/en_US/ryan/high/en_US-ryan-high.onnx.json" "en_US-ryan-high.onnx.json"
          dl "es/es_ES/carlfm/x_low/es_ES-carlfm-x_low.onnx" "es_ES-carlfm-x-low.onnx"
          dl "es/es_ES/carlfm/x_low/es_ES-carlfm-x_low.onnx.json" "es_ES-carlfm-x-low.onnx.json"
          dl "tr/tr_TR/fahrettin/medium/tr_TR-fahrettin-medium.onnx" "tr_TR-fahrettin-medium.onnx"
          dl "tr/tr_TR/fahrettin/medium/tr_TR-fahrettin-medium.onnx.json" "tr_TR-fahrettin-medium.onnx.json"
          dl "fr/fr_FR/siwis/low/fr_FR-siwis-low.onnx" "fr_FR-siwis-low.onnx"
          dl "fr/fr_FR/siwis/low/fr_FR-siwis-low.onnx.json" "fr_FR-siwis-low.onnx.json"
          dl "de/de_DE/eva_k/x_low/de_DE-eva_k-x_low.onnx" "de_DE-eva_k-x-low.onnx"
          dl "de/de_DE/eva_k/x_low/de_DE-eva_k-x_low.onnx.json" "de_DE-eva_k-x-low.onnx.json"
          dl "ja/ja_JP/thorsten/high/ja_JP-thorsten-high.onnx" "ja_JP-thorsten-high.onnx"
          dl "ja/ja_JP/thorsten/high/ja_JP-thorsten-high.onnx.json" "ja_JP-thorsten-high.onnx.json"
          dl "ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx" "ru_RU-irina-medium.onnx"
          dl "ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx.json" "ru_RU-irina-medium.onnx.json"
          dl "id/id_ID/ardhi/medium/id_ID-ardhi-medium.onnx" "id_ID-ardhi-medium.onnx"
          dl "id/id_ID/ardhi/medium/id_ID-ardhi-medium.onnx.json" "id_ID-ardhi-medium.onnx.json"
          dl "hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx" "hi_IN-pratham-medium.onnx"
          dl "hi/hi_IN/pratham/medium/hi_IN-pratham-medium.onnx.json" "hi_IN-pratham-medium.onnx.json"
          dl "pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx" "pt_BR-faber-medium.onnx"
          dl "pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx.json" "pt_BR-faber-medium.onnx.json"
          dl "it/it_IT/riccardo/x_low/it_IT-riccardo-x_low.onnx" "it_IT-riccardo-x_low.onnx"
          dl "it/it_IT/riccardo/x_low/it_IT-riccardo-x_low.onnx.json" "it_IT-riccardo-x_low.onnx.json"
          echo "=== models total ==="
          du -sh models

      - name: Build Engine
        run: |
          go mod tidy
          go vet ./... || true
          go build -o god-engine .
          echo "BUILD OK"

      - name: 🔥 GOD Production Run
        run: |
          ./god-engine
        env:
          VIDEOS_COUNT: ${{ github.event.inputs.videos }}
          CGO_ENABLED: '0'
          LD_LIBRARY_PATH: /opt/piper
          PIPER_PATH: /opt/piper/piper
          SUNO_USE_SMALL_MODELS: '1'
          SUNO_OFFLOAD_CPU: '1'
          OMP_NUM_THREADS: '2'

      - name: 🔍 Locate Output Files
        if: always()
        run: |
          echo "=== mp4 ==="
          find . -name "*.mp4" -not -path "./models/*" -not -path "./.git/*" || true
          echo "=== wav ==="
          find . -name "*.wav" -not -path "./models/*" -not -path "./.git/*" || true
          echo "=== self-tune ==="
          cat data/qa_config.json 2>/dev/null || echo "no config yet"
          echo "=== daily report ==="
          cat data/daily_report.json 2>/dev/null || echo "no report yet"
          echo "=== disk usage ==="
          du -sh models 2>/dev/null

      - name: 📦 Archive Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: |
            **/*.mp4
            **/*.jpg
            **/*.srt
            !models/**
            !.git/**
          if-no-files-found: ignore

      - name: 💾 Save State Back
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "god-engine v2.0 [skip ci]"
          file_pattern: "schedule/*.json data/*.json"
