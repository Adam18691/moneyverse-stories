name: 🔥 GOD Parallel Engine

on:
  workflow_dispatch:
    inputs:
      videos:
        description: 'عدد الفيديوهات (0 = تلقائي حسب الحصة)'
        required: false
        default: '0'
  schedule:
    - cron: '0 6,14,20 * * *'

permissions:
  contents: write

jobs:
  god-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # ============================================================
      # 🧰 أدوات أساسية — ffmpeg + edge-tts
      # ============================================================
      - name: 🧰 Install Tools (ffmpeg + edge-tts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install edge-tts --quiet
          which ffmpeg
          which edge-tts

      # ============================================================
      # 🔑 بيانات الاعتماد
      # ============================================================
      - name: 🔑 Write Credentials
        run: |
          mkdir -p credentials secrets
          [ -n "PEXELS_API_KEY" ] && echo "PEXELS_API_KEY=$PEXELS_API_KEY" >> credentials/env
          echo "✅ Credentials written:"
          ls -la credentials/
          ls -la secrets/
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      # ============================================================
      # 🥇 Kokoro-82M — الممثل المميز (Apache 2.0 تجاري)
      # ============================================================
      - name: 🥇 Install Kokoro-82M (professional voice actor)
        run: |
          pip install kokoro soundfile --quiet
          pip install misaki[ar] --quiet
          python3 -c "
          from kokoro import KPipeline
          p = KPipeline(lang_code='a')
          print('✅ kokoro-82M ready — professional voice engine')
          " || echo "⚠️ kokoro فشل — سيُستخدم piper/edge-tts تلقائياً"

      # ============================================================
      # 🗣️ Piper TTS — الحزمة الكاملة (المستوى الثاني)
      # ============================================================
      - name: 🎙️ Install Piper TTS (full bundle)
        run: |
          cd $HOME
          curl -sL "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz" -o piper.tar.gz
          tar xzf piper.tar.gz
          sudo rm -rf /opt/piper
          sudo mv piper /opt/piper
          sudo ln -sf /opt/piper/piper /usr/local/bin/piper
          echo "✅ piper bundle installed (libs + espeak-data داخلها)"

      # ============================================================
      # 🎙️ موديلات Piper — بلا مصفوفات (متوافق مع dash/sh)
      # ============================================================
      - name: 🎙️ Download Piper Voice Models
        run: |
          mkdir -p models
          download() {
            NAME=(basename(basename(basename1)
            SIZE=(stat−c(stat -c%s "models/(stat−cNAME.onnx" 2>/dev/null || echo 0)
            if [ "SIZE"−gt1000000];thenecho"⏭®SIZE" -gt 1000000 ]; then echo "  ⏭️SIZE"−gt1000000];thenecho"⏭R◯NAME موجود"; return 0; fi
            curl -4 -sL --retry 5 --retry-delay 3 --connect-timeout 20 \
              "https://huggingface.co/rhasspy/piper-voices/resolve/main/1.onnx"−o"models/1.onnx" -o "models/1.onnx"−o"models/NAME.onnx"
            curl -4 -sL --retry 5 --retry-delay 3 --connect-timeout 20 \
              "https://huggingface.co/rhasspy/piper-voices/resolve/main/1.onnx.json"−o"models/1.onnx.json" -o "models/1.onnx.json"−o"models/NAME.onnx.json"
            SIZE=(stat−c(stat -c%s "models/(stat−cNAME.onnx" 2>/dev/null || echo 0)
            if [ "$SIZE" -gt 1000000 ]; then
              echo "  ✅ NAME.onnx(NAME.onnx (NAME.onnx(((SIZE/1024/1024))MB)"
            else
              rm -f "models/$NAME.onnx"
              echo "  🔁 $NAME — edge-tts سيغطيها"
            fi
            return 0
          }
          download "ar/ar_JO/kareem/medium/ar_JO-kareem-medium"
          download "en/en_US/ryan/high/en_US-ryan-high"
          download "es/es_ES/carlfm/x_low/es_ES-carlfm-x-low"
          download "tr/tr_TR/fahrettin/medium/tr_TR-fahrettin-medium"
          download "fr/fr_FR/siwis/low/fr_FR-siwis-low"
          download "de/de_DE/eva_k-x_low/de_DE-eva_k-x-low"
          echo "📁 models/:"
          ls -la models/

      # ============================================================
      # 🔨 البناء
      # ============================================================
      - name: Build Engine
        run: |
          go mod tidy
          go vet ./... || true
          go build -o god-engine .
          echo "✅ BUILD OK"

      # ============================================================
      # 🔥 الإنتاج الكامل
      # ============================================================
      - name: 🔥 GOD Production Run
        run: |
          ./god-engine
        env:
          VIDEOS_COUNT: ${{ github.event.inputs.videos }}
          CGO_ENABLED: '0'
          LD_LIBRARY_PATH: /opt/piper
          PIPER_PATH: /opt/piper/piper

      # ============================================================
      # 📦 أرشفة النتائج
      # ============================================================
      - name: 📦 Archive Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: |
            output/*.mp4
            thumbnails/*.jpg
          if-no-files-found: ignore

      - name: 💾 Save State Back
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔥 god-engine state update [skip ci]"
          file_pattern: "schedule/*.json data/*.json"
