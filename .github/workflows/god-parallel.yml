name: 💰 GOD Money Stories Engine

on:
  schedule:
    - cron: '0 6 * * *'   # يومياً 06:00 UTC = 4 فيديوهات كل يوم ⏰
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Engine Stack
        run: |
          sudo apt-get update && sudo apt-get install -y \
            gstreamer1.0-tools gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav \
            melt imagemagick piper espeak-ng

      - name: Write YouTube Credentials
        run: |
          mkdir -p credentials
          echo "${{ secrets.YOUTUBE_CLIENT_ID }}" > credentials/client_id.txt
          echo "${{ secrets.YOUTUBE_CLIENT_SECRET }}" > credentials/client_secret.txt
          echo "${{ secrets.YOUTUBE_REFRESH_TOKEN }}" > credentials/refresh_token.txt
          cat > credentials/client_secret.json << EOF
          {
            "installed": {
              "client_id": "${{ secrets.YOUTUBE_CLIENT_ID }}",
              "client_secret": "${{ secrets.YOUTUBE_CLIENT_SECRET }}",
              "auth_uri": "https://accounts.google.com/o/oauth2/auth",
              "token_uri": "https://oauth2.googleapis.com/token",
              "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
              "redirect_uris": ["https://developers.google.com/oauthplayground"]
            }
          }
          EOF

      - run: go mod tidy

      - name: 🚀 Build + Upload 4 Videos Parallel
        run: go run main.go

      - name: 💾 Commit Publish Schedule State
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "⏰ update pending schedule [skip ci]"
          file_pattern: schedule/pending.json

      - uses: actions/upload-artifact@v4
        with:
          name: money-stories-day-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 5
