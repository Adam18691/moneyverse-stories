name: ⏰ Scheduled Publisher

on:
  schedule:
    - cron: '0 */2 * * *'   # كل ساعتين — يغطي كل نوافذ الذروة
  workflow_dispatch:

permissions:
  contents: write            # ضروري للـ commit التلقائي

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }

      - name: Restore Schedule State
        uses: actions/cache@v4
        with:
          path: schedule/pending.json
          key: pending-${{ github.run_id }}
          restore-keys: pending-

      - run: go mod tidy
      - name: 📤 Check & Publish Due Videos
        run: go run publish.go
        env:
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}

      - name: 💾 Save State Back
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "⏰ update publish schedule state [skip ci]"
          file_pattern: schedule/pending.json
