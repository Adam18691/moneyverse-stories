name: 🔥 GOD Parallel Engine

on:
  workflow_dispatch:
    inputs:
      videos:
        description: 'عدد الفيديوهات (0 = تلقائي حسب الحصة)'
        required: false
        default: '0'
  schedule:
    - cron: '0 6,14,20 * * *'

permissions:
  contents: write

jobs:
  god-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # ============================================================
      # 🧰 أدوات أساسية — ffmpeg + edge-tts + Whisper (فحص AI)
      # ============================================================
      - name: 🧰 Install Tools (ffmpeg + edge-tts + whisper)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --upgrade edge-tts --quiet
          pip install openai-whisper --quiet
          which ffmpeg
          which edge-tts

      # ============================================================
      # 🔑 بيانات الاعتماد + المجلدات
      # ============================================================
      - name: 🔑 Write Credentials
        run: |
          mkdir -p credentials secrets models data output thumbnails subtitles audio
          echo "PEXELS_API_KEY=$PEXELS_API_KEY" >> credentials/env
          echo "✅ Credentials + folders ready"
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      # ============================================================
      # 🗣️ Piper TTS — المحرك الموحد لكل اللغات
      # ============================================================
      - name: 🎙️ Install Piper TTS (full bundle)
        run: |
          cd $HOME
          curl -sL "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz" -o piper.tar.gz
          tar xzf piper.tar.gz
          sudo rm -rf /opt/piper
          sudo mv piper /opt/piper
          sudo ln -sf /opt/piper/piper /usr/local/bin/piper
          echo "✅ piper bundle installed (libs + espeak-data داخلها)"

      # ============================================================
      # 🎙️ موديلات Piper — تحقق حجم + إعادة تحميل 5 محاولات
      # ============================================================
      - name: 🎙️ Download Piper Voice Models (تحقق + إعادة تحميل)
        run: |
          mkdir -p models
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main"

          fetch() {
            URL="1";OUT="1"; OUT="1";OUT="2"; MIN="$3"
            for i in 1 2 3 4 5; do
              curl -4 -sL --retry 3 --connect-timeout 20 "URL"−o"URL" -o "URL"−o"OUT"
              SIZE=(stat−c(stat -c%s "(stat−cOUT" 2>/dev/null || echo 0)
              if [ "SIZE"−gt"SIZE" -gt "SIZE"−gt"MIN" ]; then
                echo "✅ OUT(OUT (OUT(SIZE bytes)"
                return 0
              fi
              echo "⚠️ OUTصغير/تالف(OUT صغير/تالف (OUTصغير/تالف(SIZE bytes) — محاولة $i/5 — انتظار 10ث"
              sleep 10
            done
            echo "❌ فشل نهائي: $OUT"
            return 1
          }

          fetch "$BASE/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx"       models/ar_JO-kareem-medium.onnx       50000000
          fetch "$BASE/ar/ar_JO/kareem/medium/ar_JO-kareem-medium.onnx.json"  models/ar_JO-kareem-medium.onnx.json  2000
          fetch "$BASE/en/en_US/ryan/high/en_US-ryan-high.onnx"               models/en_US-ryan-high.onnx           50000000
          fetch "$BASE/en/en_US/ryan/high/en_US-ryan-high.onnx.json"          models/en_US-ryan-high.onnx.json      2000
          fetch "$BASE/es/es_ES/carlfm/x_low/es_ES-carlfm-x-low.onnx"         models/es_ES-carlfm-x-low.onnx        20000000
          fetch "$BASE/es/es_ES/carlfm/x_low/es_ES-carlfm-x-low.onnx.json"    models/es_ES-carlfm-x-low.onnx.json   2000
          fetch "$BASE/tr/tr_TR/fahrettin/medium/tr_TR-fahrettin-medium.onnx" models/tr_TR-fahrettin-medium.onnx    20000000
          fetch "$BASE/tr/tr_TR/fahrettin/medium/tr_TR-fahrettin-medium.onnx.json" models/tr_TR-fahrettin-medium.onnx.json 2000
          fetch "$BASE/fr/fr_FR/siwis/low/fr_FR-siwis-low.onnx"               models/fr_FR-siwis-low.onnx           20000000
          fetch "$BASE/fr/fr_FR/siwis/low/fr_FR-siwis-low.onnx.json"          models/fr_FR-siwis-low.onnx.json      2000
          fetch "$BASE/de/de_DE/eva_k/x_low/de_DE-eva_k-x-low.onnx"           models/de_DE-eva_k-x-low.onnx         20000000
          fetch "$BASE/de/de_DE/eva_k/x_low/de_DE-eva_k-x-low.onnx.json"      models/de_DE-eva_k-x-low.onnx.json    2000

          echo "═══ الفحص النهائي — أول 30 حرفاً من كل JSON (يجب تبدأ بـ {) ═══"
          head -c 30 models/*.json; echo

      # ============================================================
      # 🔨 البناء
      # ============================================================
      - name: Build Engine
        run: |
          go mod tidy
          go vet ./... || true
          go build -o god-engine .
          echo "✅ BUILD OK"

      # ============================================================
      # 🔥 الإنتاج الكامل (توليد + تحسين + فحص AI + SelfTune)
      # ============================================================
      - name: 🔥 GOD Production Run
        run: |
          ./god-engine
        env:
          VIDEOS_COUNT: ${{ github.event.inputs.videos }}
          CGO_ENABLED: '0'
          LD_LIBRARY_PATH: /opt/piper
          PIPER_PATH: /opt/piper/piper

      # ============================================================
      # 🔍 تشخيص — أين الفيديوهات فعلياً؟
      # ============================================================
      - name: 🔍 Locate Output Files
        if: always()
        run: |
          echo "═══ كل ملفات mp4 ═══"
          find . -name "*.mp4" -not -path "./models/*" -not -path "./.git/*" || true
          echo "═══ كل ملفات wav ═══"
          find . -name "*.wav" -not -path "./models/*" -not -path "./.git/*" || true
          echo "═══ ذاكرة التعلم ═══"
          cat data/qa_config.json 2>/dev/null || echo "(لا إعدادات self-tune بعد — طبيعي في أول جولتين)"
          echo "═══ محتوى الجذر ═══"
          ls -la

      # ============================================================
      # 📦 أرشفة النتائج
      # ============================================================
      - name: 📦 Archive Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: |
            **/*.mp4
            **/*.jpg
            **/*.srt
            !models/**
            !.git/**
          if-no-files-found: ignore

      # ============================================================
      # 💾 حفظ الحالة + ذاكرة التعلم — التراكم عبر الجولات
      # ============================================================
      - name: 💾 Save State Back
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔥 god-engine state + QA self-tune update [skip ci]"
          file_pattern: "schedule/*.json data/*.json"
